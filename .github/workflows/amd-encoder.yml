name: Build Windows AMD Encoder Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-amd-encoder:
    name: Windows x64 AMF bridge
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Download AMD AMF SDK headers
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/GPUOpen-LibrariesAndSDKs/AMF.git "$env:RUNNER_TEMP\AMF"
          git -C "$env:RUNNER_TEMP\AMF" sparse-checkout set amf/public/include amf/public/common amf/public/common/Windows

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S native/amd_encoder -B native/amd_encoder/build `
            -G 'Visual Studio 17 2022' -A x64 `
            -DD2S_AMF_ROOT="$env:RUNNER_TEMP\AMF"

      - name: Build DLL
        shell: pwsh
        run: |
          cmake --build native/amd_encoder/build --config Release --parallel 2
          $dll = 'native/amd_encoder/build/Release/d2s_amd_encoder.dll'
          if (-not (Test-Path -LiteralPath $dll)) {
            throw "AMD encoder bridge was not produced: $dll"
          }

      - name: Upload AMD bridge artifact
        uses: actions/upload-artifact@v6
        with:
          name: d2s-amd-encoder-windows-x64
          path: native/amd_encoder/build/Release/d2s_amd_encoder.dll
          if-no-files-found: error
