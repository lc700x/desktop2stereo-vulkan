name: Build Windows NVENC CUDAARRAY Bridge

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # GitHub-hosted runners are retiring Node.js 20. Force JavaScript actions
  # onto Node.js 24 now so this native build does not emit the deprecation warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-nvenc-cudaarray:
    name: Windows x64 NVENC CUDAARRAY bridge
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Install CUDA compiler and runtime
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          # MSVC 14.44 in windows-2022 requires CUDA 12.4+ (STL1002).
          cuda: "12.4.1"
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      - name: Download NVENC API headers
        shell: pwsh
        run: |
          git clone --depth 1 --branch n12.2.72.0 https://github.com/FFmpeg/nv-codec-headers.git "$env:RUNNER_TEMP\nv-codec-headers"

      - name: Build pinned native Opus library
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git "$env:RUNNER_TEMP\opus"
          cmake -S "$env:RUNNER_TEMP\opus" -B "$env:RUNNER_TEMP\opus-build" `
            -G 'Visual Studio 17 2022' -A x64 `
            -DOPUS_BUILD_PROGRAMS=OFF -DOPUS_BUILD_TESTING=OFF `
            -DOPUS_BUILD_SHARED_LIBRARY=ON
          cmake --build "$env:RUNNER_TEMP\opus-build" --config Release --parallel 2

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S native/nvenc_cudaarray_bridge -B native/nvenc_cudaarray_bridge/build `
            -G 'Visual Studio 17 2022' -A x64 `
            -DD2S_NV_CODEC_HEADERS="$env:RUNNER_TEMP\nv-codec-headers"

      - name: Build DLL
        shell: pwsh
        run: |
          cmake --build native/nvenc_cudaarray_bridge/build --config Release --parallel 2
          $dll = 'native/nvenc_cudaarray_bridge/build/Release/d2s_nvenc_cudaarray_bridge.dll'
          if (-not (Test-Path -LiteralPath $dll)) {
            throw "NVENC CUDAARRAY bridge was not produced: $dll"
          }
          $opus = "$env:RUNNER_TEMP\opus-build\Release\opus.dll"
          if (-not (Test-Path -LiteralPath $opus)) {
            throw "Native Opus library was not produced: $opus"
          }
          Copy-Item -LiteralPath $opus -Destination native/nvenc_cudaarray_bridge/build/Release/opus.dll

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v6
        with:
          name: d2s-nvenc-cudaarray-windows-x64
          path: |
            native/nvenc_cudaarray_bridge/build/Release/d2s_nvenc_cudaarray_bridge.dll
            native/nvenc_cudaarray_bridge/build/Release/opus.dll
          if-no-files-found: error

  commit-native-binary:
    name: Commit feature DLL
    needs: build-windows-nvenc-cudaarray
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: d2s-nvenc-cudaarray-windows-x64
          path: artifact

      - name: Install DLL in the streaming feature folder
        shell: bash
        run: |
          mkdir -p src/desktop2stereo/streaming/nvenc_cudaarray_bridge
          mkdir -p src/desktop2stereo/streaming/native_rtsp_output
          cp artifact/d2s_nvenc_cudaarray_bridge.dll \
            src/desktop2stereo/streaming/nvenc_cudaarray_bridge/d2s_nvenc_cudaarray_bridge.dll
          cp artifact/opus.dll \
            src/desktop2stereo/streaming/native_rtsp_output/opus.dll

      - name: Commit generated DLL
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/desktop2stereo/streaming/nvenc_cudaarray_bridge/d2s_nvenc_cudaarray_bridge.dll \
            src/desktop2stereo/streaming/native_rtsp_output/opus.dll
          if git diff --cached --quiet; then
            echo "Native DLL is unchanged"
            exit 0
          fi
          git commit -m "build: update NVENC CUDAARRAY bridge"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
