name: Build Filament Bridge

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x86_64
    # The bridge uses the Visual Studio 2022 CMake generator explicitly.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Cache patched Filament build
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/filament-source
            ${{ runner.temp }}/filament-install
          key: filament-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/filament/version.json', 'native/filament/patches/**', '.github/workflows/filament-bridge.yml') }}

      - name: Build patched Filament Vulkan backend
        shell: pwsh
        run: |
          $config = Get-Content -Raw -Encoding utf8 'native/filament/version.json' | ConvertFrom-Json
          $sourceRoot = Join-Path $env:RUNNER_TEMP 'filament-source'
          $installRoot = Join-Path $env:RUNNER_TEMP 'filament-install'
          if (-not (Test-Path -LiteralPath (Join-Path $sourceRoot '.git'))) {
            git clone --recursive --depth 1 --branch $config.source.ref $config.source.repository $sourceRoot
            python native/filament/patches/apply_d2s_vulkan_external_image.py $sourceRoot
          }
          if (-not (Test-Path -LiteralPath (Join-Path $installRoot 'include/filament/Engine.h'))) {
            cmake -S $sourceRoot -B (Join-Path $sourceRoot 'out/d2s') `
              -G 'Visual Studio 17 2022' -A x64 `
              -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_INSTALL_PREFIX="$installRoot" `
              -DFILAMENT_SUPPORTS_VULKAN=ON `
              -DFILAMENT_ENABLE_MULTIVIEW=ON `
              -DFILAMENT_BUILD_FILAMAT=ON `
              -DFILAMENT_SKIP_SAMPLES=ON
            cmake --build (Join-Path $sourceRoot 'out/d2s') --config Release --target INSTALL --parallel 2
          } else {
            Write-Host 'Reusing cached patched Filament install.'
          }
          $sdkRoot = $installRoot
          if (-not (Test-Path -LiteralPath (Join-Path $sdkRoot 'include/filament/Engine.h'))) {
            throw 'Patched Filament install did not produce public headers'
          }
          "FILAMENT_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure and build bridge
        shell: pwsh
        run: |
          cmake -S native/filament/bridge -B native/filament/build/ci-windows `
            -G 'Visual Studio 17 2022' -A x64 `
            -DFILAMENT_SDK_ROOT="$env:FILAMENT_SDK_ROOT" `
            -DD2S_FILAMENT_VULKAN_EXTERNAL_IMAGE=ON
          cmake --build native/filament/build/ci-windows --config Release --parallel 2
          if (-not (Test-Path -LiteralPath 'src/desktop2stereo/xr_viewer/native/windows/filament_bridge.dll')) {
            throw 'Windows Filament bridge was not produced'
          }

      - uses: actions/upload-artifact@v6
        with:
          name: filament-bridge-windows-latest
          path: src/desktop2stereo/xr_viewer/native/windows/filament_bridge.dll
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            platform: linux
            output: libfilament_bridge.so
            needs_vulkan_dev: true
          - name: macOS arm64
            runner: macos-14
            platform: macos
            output: libfilament_bridge.dylib
            needs_vulkan_dev: false

    steps:
      - uses: actions/checkout@v5

      - name: Cache patched Filament build
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/filament-source
            ${{ runner.temp }}/filament-install
          key: filament-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/filament/version.json', 'native/filament/patches/**', '.github/workflows/filament-bridge.yml') }}

      - name: Install Linux Vulkan development files
        if: matrix.needs_vulkan_dev
        run: sudo apt-get update && sudo apt-get install --yes clang libc++-dev libc++abi-dev libvulkan-dev libxcb1-dev libx11-dev libxi-dev libxxf86vm-dev libgl1-mesa-dev

      - name: Install macOS Vulkan headers
        if: matrix.platform == 'macos'
        run: brew install vulkan-headers

      - name: Build patched Filament Vulkan backend
        shell: bash
        run: |
          set -euo pipefail
          repository="$(jq -r '.source.repository' native/filament/version.json)"
          ref="$(jq -r '.source.ref' native/filament/version.json)"
          source_root="$RUNNER_TEMP/filament-source"
          install_root="$RUNNER_TEMP/filament-install"
          if [[ ! -d "$source_root/.git" ]]; then
            git clone --recursive --depth 1 --branch "$ref" "$repository" "$source_root"
            python3 native/filament/patches/apply_d2s_vulkan_external_image.py "$source_root"
          fi
          if [[ ! -f "$install_root/include/filament/Engine.h" ]]; then
            cmake -S "$source_root" -B "$source_root/out/d2s" \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_INSTALL_PREFIX="$install_root" \
              -DFILAMENT_SUPPORTS_VULKAN=ON \
              -DFILAMENT_ENABLE_MULTIVIEW=ON \
              -DFILAMENT_BUILD_FILAMAT=ON \
              -DFILAMENT_SKIP_SAMPLES=ON
            cmake --build "$source_root/out/d2s" --target install --parallel 2
          else
            echo 'Reusing cached patched Filament install.'
          fi
          test -f "$install_root/include/filament/Engine.h"
          echo "FILAMENT_SDK_ROOT=$install_root" >> "$GITHUB_ENV"

      - name: Configure and build bridge
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native/filament/bridge -B native/filament/build/ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DFILAMENT_SDK_ROOT="$FILAMENT_SDK_ROOT" \
            -DD2S_FILAMENT_VULKAN_EXTERNAL_IMAGE=ON
          cmake --build native/filament/build/ci --config Release --parallel 2
          test -f "src/desktop2stereo/xr_viewer/native/${{ matrix.platform }}/${{ matrix.output }}"

      - uses: actions/upload-artifact@v6
        with:
          name: filament-bridge-${{ matrix.runner }}
          path: src/desktop2stereo/xr_viewer/native/${{ matrix.platform }}/${{ matrix.output }}
          if-no-files-found: error

  commit-native-binaries:
    name: Commit native bridge binaries
    if: github.ref == 'refs/heads/main'
    needs:
      - build-windows
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Download Windows bridge
        uses: actions/download-artifact@v7
        with:
          name: filament-bridge-windows-latest
          path: src/desktop2stereo/xr_viewer/native/windows

      - name: Download Linux bridge
        uses: actions/download-artifact@v7
        with:
          name: filament-bridge-ubuntu-latest
          path: src/desktop2stereo/xr_viewer/native/linux

      - name: Download macOS bridge
        uses: actions/download-artifact@v7
        with:
          name: filament-bridge-macos-14
          path: src/desktop2stereo/xr_viewer/native/macos

      - name: Commit binaries to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -f src/desktop2stereo/xr_viewer/native/windows/filament_bridge.dll
          test -f src/desktop2stereo/xr_viewer/native/linux/libfilament_bridge.so
          test -f src/desktop2stereo/xr_viewer/native/macos/libfilament_bridge.dylib
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/desktop2stereo/xr_viewer/native/windows/filament_bridge.dll \
            src/desktop2stereo/xr_viewer/native/linux/libfilament_bridge.so \
            src/desktop2stereo/xr_viewer/native/macos/libfilament_bridge.dylib
          if git diff --cached --quiet; then
            echo "Native bridge binaries are already up to date."
            exit 0
          fi
          git commit -m "build: update Filament bridge binaries"
          git push origin HEAD:main
