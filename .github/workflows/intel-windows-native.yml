name: Build Intel Windows Native Bridges

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-intel-windows-native:
    name: Windows x64 Desktop Duplication, D3D11 surface and oneVPL
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v5

      - name: Download official oneVPL dispatcher source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/oneapi-src/oneVPL.git "$env:RUNNER_TEMP\oneVPL"

      - name: Download official OpenVINO Windows C++ archive
        shell: pwsh
        run: |
          $url = "https://storage.openvinotoolkit.org/repositories/openvino/packages/2026.3/windows/openvino_toolkit_windows_2026.3.0.22451.bd8d6542e3c_x86_64.zip"
          $archive = "$env:RUNNER_TEMP\openvino.zip"
          $extract = "$env:RUNNER_TEMP\openvino"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $header = Get-ChildItem -LiteralPath $extract -Recurse -Filter openvino.hpp |
            Where-Object { $_.FullName -match "[\\/]include[\\/]openvino[\\/]openvino\.hpp$" } |
            Select-Object -First 1
          if (-not $header) {
            throw "OpenVINO C++ header was not found in the official archive"
          }
          "D2S_OPENVINO_ROOT=$($header.Directory.Parent.Parent.Parent.FullName)" >> $env:GITHUB_ENV

      - name: Download official Khronos OpenCL headers
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git "$env:RUNNER_TEMP\opencl-headers"
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-CLHPP.git "$env:RUNNER_TEMP\opencl-clhpp"
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-ICD-Loader.git "$env:RUNNER_TEMP\opencl-icd-loader"

      - name: Build official Khronos OpenCL ICD loader
        shell: pwsh
        run: |
          $source = "$env:RUNNER_TEMP\opencl-icd-loader"
          $build = "$env:RUNNER_TEMP\opencl-icd-build"
          $install = "$env:RUNNER_TEMP\opencl-icd-install"
          cmake -S $source -B $build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DOPENCL_ICD_LOADER_HEADERS_DIR="$env:RUNNER_TEMP\opencl-headers" `
            "-DCMAKE_INSTALL_PREFIX=$install"
          cmake --build $build --config Release --parallel 2
          cmake --install $build --config Release
          if (-not (Test-Path -LiteralPath "$install\lib\OpenCL.lib")) {
            throw "OpenCL ICD loader import library was not installed"
          }

      - name: Build official oneVPL dispatcher
        shell: pwsh
        run: |
          $source = "$env:RUNNER_TEMP\oneVPL"
          $build = "$env:RUNNER_TEMP\oneVPL-build"
          $install = "$env:RUNNER_TEMP\oneVPL-install"
          cmake -S $source -B $build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DBUILD_EXAMPLES=OFF `
            -DINSTALL_EXAMPLES=OFF `
            "-DCMAKE_INSTALL_PREFIX=$install"
          cmake --build $build --config Release --parallel 2
          cmake --install $build --config Release
          if (-not (Test-Path -LiteralPath "$install\include\vpl\mfx.h")) {
            throw "oneVPL headers were not installed"
          }
          if (-not (Test-Path -LiteralPath "$install\lib\vpl.lib")) {
            throw "oneVPL import library was not installed"
          }

      - name: Configure Desktop Duplication bridge
        shell: pwsh
        run: |
          cmake -S native/desktop_duplication -B native/desktop_duplication/build/ci `
            -G "Visual Studio 17 2022" -A x64

      - name: Configure final SBS D3D11 surface bridge
        shell: pwsh
        run: |
          cmake -S native/d3d11_sbs_surface -B native/d3d11_sbs_surface/build/ci `
            -G "Visual Studio 17 2022" -A x64

      - name: Configure oneVPL D3D11 encoder bridge
        shell: pwsh
        run: |
          cmake -S native/onevpl_d3d11_encoder -B native/onevpl_d3d11_encoder/build/ci `
            -G "Visual Studio 17 2022" -A x64 `
            -DD2S_ONEVPL_ROOT="$env:RUNNER_TEMP\oneVPL-install"

      - name: Configure OpenVINO D3D11 bridge
        shell: pwsh
        run: |
          cmake -S native/openvino_d3d11_bridge -B native/openvino_d3d11_bridge/build/ci `
            -G "Visual Studio 17 2022" -A x64 `
            -DD2S_OPENVINO_ROOT="$env:D2S_OPENVINO_ROOT" `
            -DD2S_OPENCL_INCLUDE_DIR="$env:RUNNER_TEMP\opencl-headers" `
            -DD2S_OPENCL_HPP_INCLUDE_DIR="$env:RUNNER_TEMP\opencl-clhpp\include" `
            -DD2S_OPENCL_LIBRARY="$env:RUNNER_TEMP\opencl-icd-install\lib\OpenCL.lib"

      - name: Build Intel native bridges
        shell: pwsh
        run: |
          cmake --build native/desktop_duplication/build/ci --config Release --parallel 2
          cmake --build native/d3d11_sbs_surface/build/ci --config Release --parallel 2
          cmake --build native/onevpl_d3d11_encoder/build/ci --config Release --parallel 2
          cmake --build native/openvino_d3d11_bridge/build/ci --config Release --parallel 2

          $required = @(
            "native/desktop_duplication/build/ci/Release/d2s_desktop_duplication.dll",
            "native/d3d11_sbs_surface/build/ci/Release/d2s_d3d11_sbs_surface.dll",
            "native/onevpl_d3d11_encoder/build/ci/Release/d2s_onevpl_d3d11_encoder.dll"
            ,"native/openvino_d3d11_bridge/build/ci/Release/d2s_openvino_d3d11_bridge.dll"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Native bridge was not produced: $path"
            }
          }

      - name: Validate native bridge exports and oneVPL linkage
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem -Path "${env:ProgramFiles}\Microsoft Visual Studio\2022" `
            -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) {
            throw "Visual Studio dumpbin.exe was not found on the runner"
          }
          $exports = @{
            "native/desktop_duplication/build/ci/Release/d2s_desktop_duplication.dll" = @(
              "d2s_desktop_duplication_probe",
              "d2s_desktop_duplication_create",
              "d2s_desktop_duplication_acquire",
              "d2s_desktop_duplication_copy_frame"
            )
            "native/d3d11_sbs_surface/build/ci/Release/d2s_d3d11_sbs_surface.dll" = @(
            "d2s_d3d11_sbs_surface_probe",
            "d2s_d3d11_sbs_surface_create_from_device",
            "d2s_d3d11_sbs_surface_create_for_adapter_luid",
            "d2s_d3d11_sbs_surface_bgra_texture",
            "d2s_d3d11_sbs_surface_shared_handle",
            "d2s_d3d11_sbs_surface_set_bgra_texture",
            "d2s_d3d11_sbs_surface_upload_bgra",
              "d2s_d3d11_sbs_surface_nv12"
            )
            "native/onevpl_d3d11_encoder/build/ci/Release/d2s_onevpl_d3d11_encoder.dll" = @(
            "d2s_onevpl_d3d11_probe",
            "d2s_onevpl_d3d11_adapter_luid",
            "d2s_onevpl_d3d11_submit_nv12",
            "d2s_onevpl_d3d11_read_packet"
            )
            "native/openvino_d3d11_bridge/build/ci/Release/d2s_openvino_d3d11_bridge.dll" = @(
              "d2s_openvino_d3d11_capabilities",
              "d2s_openvino_d3d11_set_texture",
              "d2s_openvino_d3d11_infer"
            )
          }
          foreach ($entry in $exports.GetEnumerator()) {
            $dump = (& $dumpbin /nologo /exports $entry.Key | Out-String)
            foreach ($symbol in $entry.Value) {
              if ($dump -notmatch [regex]::Escape($symbol)) {
                throw "Missing export $symbol from $($entry.Key)"
              }
            }
          }
          $onevplPath = "native/onevpl_d3d11_encoder/build/ci/Release/d2s_onevpl_d3d11_encoder.dll"
          $imports = (& $dumpbin /nologo /imports $onevplPath | Out-String)
          if ($imports -notmatch "libvpl\.dll") {
            throw "oneVPL bridge is not linked to the remotely built dispatcher"
          }

      - name: Prepare Intel native bridge artifact
        shell: pwsh
        run: |
          $artifact = "$env:RUNNER_TEMP\d2s-intel-windows-native-x64"
          New-Item -ItemType Directory -Path $artifact -Force | Out-Null
          $files = @(
            "native/desktop_duplication/build/ci/Release/d2s_desktop_duplication.dll",
            "native/d3d11_sbs_surface/build/ci/Release/d2s_d3d11_sbs_surface.dll",
            "native/onevpl_d3d11_encoder/build/ci/Release/d2s_onevpl_d3d11_encoder.dll",
            "native/openvino_d3d11_bridge/build/ci/Release/d2s_openvino_d3d11_bridge.dll",
            "$env:RUNNER_TEMP\oneVPL-install\bin\libvpl.dll"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Artifact input was not found: $file"
            }
            Copy-Item -LiteralPath $file -Destination $artifact -Force
          }
          $openvinoRuntimeNames = @(
            "openvino.dll",
            "openvino_intel_gpu_plugin.dll",
            "openvino_intel_cpu_plugin.dll",
            "openvino_auto_plugin.dll",
            "openvino_ir_frontend.dll",
            "tbb12.dll",
            "tbbmalloc.dll"
          )
          $openvinoRuntimeFiles = @()
          foreach ($name in $openvinoRuntimeNames) {
            $runtimeFile = Get-ChildItem -LiteralPath $env:D2S_OPENVINO_ROOT -Recurse -Filter $name |
              Select-Object -First 1
            if ($runtimeFile) {
              Copy-Item -LiteralPath $runtimeFile.FullName -Destination $artifact -Force
              $openvinoRuntimeFiles += $name
            } elseif ($name -eq "openvino.dll") {
              throw "Required OpenVINO runtime DLL was not found: $name"
            }
          }
          $manifest = [ordered]@{
            schema = 1
            platform = "windows-x64"
            capture = "d2s_desktop_duplication.dll"
            final_sbs_surface = "d2s_d3d11_sbs_surface.dll"
            encoder = "d2s_onevpl_d3d11_encoder.dll"
            inference = "d2s_openvino_d3d11_bridge.dll"
            openvino_runtime_files = $openvinoRuntimeFiles
            onevpl_runtime = "libvpl.dll"
            remote_build = "GitHub Actions windows-2022"
            openvino_runtime = "Install the matching official OpenVINO Windows runtime on the target machine"
            intel_driver = "Required on the target machine for Desktop Duplication, GPU RemoteTensor and oneVPL hardware encoding"
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath "$artifact\manifest.json" -Encoding utf8
          $hashes = Get-ChildItem -LiteralPath $artifact -File |
            Where-Object { $_.Extension -ieq '.dll' } |
            ForEach-Object {
              [ordered]@{
                file = $_.Name
                sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
              }
            }
          $hashes | ConvertTo-Json | Set-Content -LiteralPath "$artifact\sha256.json" -Encoding utf8

      - name: Upload Intel native bridge artifacts
        uses: actions/upload-artifact@v6
        with:
          name: d2s-intel-windows-native-x64
          if-no-files-found: error
          path: ${{ runner.temp }}/d2s-intel-windows-native-x64/*

  commit-native-binaries:
    name: Commit Intel native bridge binaries
    needs: build-intel-windows-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Download Intel native bridge artifact
        uses: actions/download-artifact@v7
        with:
          name: d2s-intel-windows-native-x64
          path: ${{ runner.temp }}/d2s-intel-windows-native-x64

      - name: Commit Intel native binaries to runtime tree
        shell: bash
        run: |
          set -euo pipefail
          bundle="${{ runner.temp }}/d2s-intel-windows-native-x64"
          capture_dir="src/desktop2stereo/capture/native/desktop_duplication"
          surface_dir="src/desktop2stereo/stereo_runtime/providers/intel/native/d3d11_sbs_surface"
          onevpl_dir="src/desktop2stereo/stereo_runtime/providers/intel/native/onevpl_d3d11_encoder"
          openvino_dir="src/desktop2stereo/stereo_runtime/providers/intel/native/openvino_d3d11_bridge"
          metadata_dir="src/desktop2stereo/stereo_runtime/providers/intel/native"
          for file in d2s_desktop_duplication.dll d2s_d3d11_sbs_surface.dll d2s_onevpl_d3d11_encoder.dll d2s_openvino_d3d11_bridge.dll libvpl.dll manifest.json sha256.json; do
            test -f "$bundle/$file"
          done
          mkdir -p "$capture_dir" "$surface_dir" "$onevpl_dir" "$openvino_dir" "$metadata_dir"
          cp "$bundle/d2s_desktop_duplication.dll" "$capture_dir/"
          cp "$bundle/d2s_d3d11_sbs_surface.dll" "$surface_dir/"
          cp "$bundle/d2s_onevpl_d3d11_encoder.dll" "$onevpl_dir/"
          cp "$bundle/libvpl.dll" "$onevpl_dir/"
          cp "$bundle/d2s_openvino_d3d11_bridge.dll" "$openvino_dir/"
          for file in "$bundle"/*.dll; do
            name="$(basename "$file")"
            case "$name" in
              d2s_desktop_duplication.dll|d2s_d3d11_sbs_surface.dll|d2s_onevpl_d3d11_encoder.dll|d2s_openvino_d3d11_bridge.dll|libvpl.dll) ;;
              *) cp "$file" "$openvino_dir/" ;;
            esac
          done
          cp "$bundle/manifest.json" "$metadata_dir/"
          cp "$bundle/sha256.json" "$metadata_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$capture_dir" "$surface_dir" "$onevpl_dir" "$openvino_dir" "$metadata_dir"
          if git diff --cached --quiet; then
            echo "Intel native runtime binaries are already up to date."
            exit 0
          fi
          git commit -m "build: update Intel native runtime binaries"
          # The source push that triggered this workflow may be followed by
          # another documentation/test commit while Windows compilation runs.
          # Rebase the generated binary commit before pushing so a successful
          # remote build is not lost to a non-fast-forward race.
          git fetch origin main
          if ! git rebase origin/main; then
            # Generated bridge metadata is the artifact from this build. If a
            # newer source push changed the same generated metadata file, keep
            # the freshly built artifact and continue the rebase explicitly.
            if git ls-files -u --error-unmatch src/desktop2stereo/stereo_runtime/providers/intel/native/sha256.json >/dev/null 2>&1; then
              git checkout --theirs -- src/desktop2stereo/stereo_runtime/providers/intel/native/sha256.json
              git add src/desktop2stereo/stereo_runtime/providers/intel/native/sha256.json
              GIT_EDITOR=true git rebase --continue
            else
              git rebase --abort
              exit 1
            fi
          fi
          git push origin HEAD:main
