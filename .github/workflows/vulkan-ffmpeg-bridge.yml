name: Build Vulkan FFmpeg Bridge

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Install MinGW and Vulkan development packages
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -lc 'pacman --noconfirm -Syuu'
          C:\msys64\usr\bin\bash.exe -lc 'pacman --noconfirm -S --needed mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-vulkan-headers mingw-w64-x86_64-vulkan-loader unzip'

      - name: Download pinned FFmpeg development package
        shell: pwsh
        env:
          FFMPEG_RELEASE_URL: https://github.com/laiyangli001/desktop2stereo-ffmpeg-builds/releases/download/ffmpeg-v9.0.1-d2s.2/d2s-ffmpeg-9.0.1-d2s.2-windows-amd64.zip
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'd2s-ffmpeg.zip'
          Invoke-WebRequest -Uri $env:FFMPEG_RELEASE_URL -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP\ffmpeg -Force
          $root = Join-Path $env:RUNNER_TEMP 'ffmpeg\ffmpeg'
          if (-not (Test-Path -LiteralPath (Join-Path $root 'include\libavcodec\avcodec.h'))) { throw 'FFmpeg development headers are missing' }
          "D2S_FFMPEG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure and build native bridge
        shell: pwsh
        run: |
          $env:Path = "C:\msys64\mingw64\bin;C:\msys64\usr\bin;$env:Path"
          $cmake = 'C:\msys64\mingw64\bin\cmake.exe'
          $ninja = 'C:\msys64\mingw64\bin\ninja.exe'
          $gcc = 'C:\msys64\mingw64\bin\gcc.exe'
          $gxx = 'C:\msys64\mingw64\bin\g++.exe'
          & $cmake -S native/vulkan_ffmpeg_bridge -B native/vulkan_ffmpeg_bridge/build/ci `
            -G Ninja `
            -DCMAKE_MAKE_PROGRAM="$ninja" `
            -DCMAKE_C_COMPILER="$gcc" `
            -DCMAKE_CXX_COMPILER="$gxx" `
            -DCMAKE_PREFIX_PATH='C:\msys64\mingw64' `
            -DCMAKE_BUILD_TYPE=Release `
            -DD2S_FFMPEG_ROOT="$env:D2S_FFMPEG_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cmake --build native/vulkan_ffmpeg_bridge/build/ci --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify ABI exports
        shell: pwsh
        run: |
          $dll = Get-ChildItem -LiteralPath native\vulkan_ffmpeg_bridge\build\ci -Recurse -File |
            Where-Object { $_.Name -in @('d2s_vulkan_ffmpeg_bridge.dll', 'libd2s_vulkan_ffmpeg_bridge.dll') } |
            Select-Object -First 1
          if (-not $dll) { throw 'Vulkan FFmpeg bridge DLL was not produced' }
          & 'C:\msys64\mingw64\bin\nm.exe' -g $dll.FullName | Select-String 'd2s_vulkan_ffmpeg_bridge_abi_version|d2s_vulkan_ffmpeg_encoder_acquire_frame|d2s_vulkan_ffmpeg_encoder_submit_frame|d2s_vulkan_ffmpeg_encoder_read_packet|d2s_vulkan_ffmpeg_encoder_flush'
          if ($LASTEXITCODE -ne 0) { throw 'Required Vulkan bridge ABI exports are missing' }

      - name: Stage shared runtime and verify ABI 5 load
        shell: pwsh
        run: |
          $dll = Get-ChildItem -LiteralPath native\vulkan_ffmpeg_bridge\build\ci -Recurse -File |
            Where-Object { $_.Name -eq 'd2s_vulkan_ffmpeg_bridge.dll' } |
            Select-Object -First 1
          if (-not $dll) { throw 'Vulkan FFmpeg bridge DLL was not produced' }
          $downloadedRuntime = (Resolve-Path "$env:D2S_FFMPEG_ROOT\bin").Path
          $mingwRuntime = 'C:\msys64\mingw64\bin'
          $deploy = New-Item -ItemType Directory -Force -Path native\vulkan_ffmpeg_bridge\build\ci\deploy
          $bridgeDeploy = New-Item -ItemType Directory -Force -Path (Join-Path $deploy.FullName 'bridge')
          $runtimeDeploy = New-Item -ItemType Directory -Force -Path (Join-Path $deploy.FullName 'runtime')
          Copy-Item -LiteralPath $dll.FullName -Destination $bridgeDeploy.FullName -Force
          Get-ChildItem -LiteralPath $downloadedRuntime -File |
            Where-Object { $_.Extension -in @('.dll', '.exe') } |
            Copy-Item -Destination $runtimeDeploy.FullName -Force
          $deployedBridge = Join-Path $bridgeDeploy.FullName 'd2s_vulkan_ffmpeg_bridge.dll'
          $queue = [System.Collections.Generic.Queue[string]]::new()
          $queue.Enqueue($deployedBridge)
          $seen = @{}
          while ($queue.Count -gt 0) {
            $current = $queue.Dequeue()
            foreach ($line in (& "$mingwRuntime\objdump.exe" -p $current)) {
              if ($line -notmatch 'DLL Name:\s*(\S+)') { continue }
              $name = $Matches[1]
              $key = $name.ToLowerInvariant()
              if ($seen.ContainsKey($key)) { continue }
              $seen[$key] = $true
              if ($key -eq 'vulkan-1.dll') {
                Write-Host 'vulkan-1.dll is supplied by the target system GPU driver'
                continue
              }
              $shared = Join-Path $runtimeDeploy.FullName $name
              if (Test-Path -LiteralPath $shared) {
                $queue.Enqueue($shared)
                continue
              }
              $mingw = Join-Path $mingwRuntime $name
              if (Test-Path -LiteralPath $mingw) {
                throw "Shared FFmpeg runtime dependency is missing: $name"
              }
            }
          }
          $env:D2S_VULKAN_BRIDGE_PROBE_DLL = $deployedBridge
          $env:D2S_SHARED_FFMPEG_RUNTIME = $runtimeDeploy.FullName
          $env:D2S_CI_VULKAN_LOADER = $mingwRuntime
          @'
          import ctypes
          import os
          from pathlib import Path
          dll = Path(os.environ["D2S_VULKAN_BRIDGE_PROBE_DLL"])
          ctypes.windll.kernel32.SetDefaultDllDirectories(0x00001000)
          os.add_dll_directory(os.environ["D2S_SHARED_FFMPEG_RUNTIME"])
          os.add_dll_directory(os.environ["D2S_CI_VULKAN_LOADER"])
          os.add_dll_directory(str(dll.parent))
          lib = ctypes.CDLL(str(dll))
          lib.d2s_vulkan_ffmpeg_bridge_abi_version.restype = ctypes.c_uint32
          if lib.d2s_vulkan_ffmpeg_bridge_abi_version() != 5:
              raise SystemExit("Vulkan bridge ABI is not 5")
          print("Vulkan bridge ABI 5 shared-runtime load passed")
          '@ | python -
          Get-ChildItem -LiteralPath $runtimeDeploy.FullName -File | Select-Object Name, Length

      - uses: actions/upload-artifact@v6
        with:
          name: d2s-vulkan-ffmpeg-bridge-windows-amd64
          path: native/vulkan_ffmpeg_bridge/build/ci/deploy/**
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Vulkan and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build g++ libvulkan-dev vulkan-tools pkg-config curl xz-utils binutils

      - name: Download pinned FFmpeg development package
        env:
          FFMPEG_RELEASE_URL: https://github.com/laiyangli001/desktop2stereo-ffmpeg-builds/releases/download/ffmpeg-v9.0.1-d2s.2/d2s-ffmpeg-9.0.1-d2s.2-linux-amd64.tar.xz
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/d2s-ffmpeg.tar.xz"
          curl --fail --location --retry 3 "$FFMPEG_RELEASE_URL" --output "$archive"
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$archive" -C "$RUNNER_TEMP/ffmpeg"
          root="$RUNNER_TEMP/ffmpeg/ffmpeg"
          test -f "$root/include/libavcodec/avcodec.h"
          test -f "$root/lib/libavcodec.so"
          echo "D2S_FFMPEG_ROOT=$root" >> "$GITHUB_ENV"

      - name: Configure and build native bridge
        run: |
          set -euo pipefail
          cmake -S native/vulkan_ffmpeg_bridge -B native/vulkan_ffmpeg_bridge/build/ci \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DD2S_FFMPEG_ROOT="$D2S_FFMPEG_ROOT"
          cmake --build native/vulkan_ffmpeg_bridge/build/ci --parallel 2

      - name: Verify ABI exports
        run: |
          set -euo pipefail
          bridge=$(find native/vulkan_ffmpeg_bridge/build/ci -type f -name 'd2s_vulkan_ffmpeg_bridge.so' -print -quit)
          test -n "$bridge"
          nm -D --defined-only "$bridge" | grep -E 'd2s_vulkan_ffmpeg_bridge_abi_version|d2s_vulkan_ffmpeg_encoder_acquire_frame|d2s_vulkan_ffmpeg_encoder_submit_frame|d2s_vulkan_ffmpeg_encoder_read_packet|d2s_vulkan_ffmpeg_encoder_flush'

      - name: Stage shared runtime dependencies and verify loader closure
        run: |
          set -euo pipefail
          bridge=$(find native/vulkan_ffmpeg_bridge/build/ci -type f -name 'd2s_vulkan_ffmpeg_bridge.so' -print -quit)
          test -n "$bridge"
          deploy=native/vulkan_ffmpeg_bridge/build/ci/deploy
          bridge_deploy="$deploy/bridge"
          runtime_deploy="$deploy/runtime"
          mkdir -p "$bridge_deploy" "$runtime_deploy"
          cp "$bridge" "$bridge_deploy/d2s_vulkan_ffmpeg_bridge.so"
          queue=("$bridge_deploy/d2s_vulkan_ffmpeg_bridge.so")
          declare -A seen=()
          while (("${#queue[@]}")); do
            current=${queue[0]}
            queue=("${queue[@]:1}")
            while read -r dependency; do
              [[ -n "$dependency" ]] || continue
              [[ -z "${seen[$dependency]+x}" ]] || continue
              seen[$dependency]=1
              source="$D2S_FFMPEG_ROOT/lib/$dependency"
              [[ -e "$source" ]] || continue
              cp -L "$source" "$runtime_deploy/$dependency"
              queue+=("$runtime_deploy/$dependency")
            done < <(readelf -d "$current" | sed -n 's/.*Shared library: \[\([^]]*\)\].*/\1/p')
          done
          LD_LIBRARY_PATH="$runtime_deploy" ldd "$bridge_deploy/d2s_vulkan_ffmpeg_bridge.so" |
            tee "$RUNNER_TEMP/vulkan-bridge-ldd.txt"
          ! grep -q 'not found' "$RUNNER_TEMP/vulkan-bridge-ldd.txt"
          ls -lh "$bridge_deploy" "$runtime_deploy"

      - uses: actions/upload-artifact@v6
        with:
          name: d2s-vulkan-ffmpeg-bridge-linux-amd64
          path: native/vulkan_ffmpeg_bridge/build/ci/deploy/**
          if-no-files-found: error

  commit-native-binaries:
    name: Publish ABI 5 bridges and shared Linux runtime
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: d2s-vulkan-ffmpeg-bridge-windows-amd64
          path: artifact/windows

      - uses: actions/download-artifact@v7
        with:
          name: d2s-vulkan-ffmpeg-bridge-linux-amd64
          path: artifact/linux

      - name: Install feature bridges and shared runtime
        shell: bash
        run: |
          set -euo pipefail
          feature=src/desktop2stereo/streaming/vulkan_ffmpeg_bridge
          shared_windows=src/desktop2stereo/streaming/rtmp/ffmpeg/bin
          shared_linux=src/desktop2stereo/streaming/rtmp/ffmpeg/lib
          mkdir -p "$feature/windows" "$feature/linux" "$shared_windows" "$shared_linux"
          find "$feature/windows" -maxdepth 1 -type f \
            ! -name d2s_vulkan_ffmpeg_bridge.dll -delete
          find "$feature/linux" -maxdepth 1 -type f \
            ! -name d2s_vulkan_ffmpeg_bridge.so -delete
          find "$shared_windows" -maxdepth 1 -type f -delete
          find "$shared_linux" -maxdepth 1 -type f -name '*.so*' -delete
          cp artifact/windows/bridge/d2s_vulkan_ffmpeg_bridge.dll \
            "$feature/windows/d2s_vulkan_ffmpeg_bridge.dll"
          cp artifact/windows/runtime/* "$shared_windows/"
          cp artifact/linux/bridge/d2s_vulkan_ffmpeg_bridge.so \
            "$feature/linux/d2s_vulkan_ffmpeg_bridge.so"
          cp artifact/linux/runtime/* "$shared_linux/"
          test -f "$feature/windows/d2s_vulkan_ffmpeg_bridge.dll"
          test -f "$feature/linux/d2s_vulkan_ffmpeg_bridge.so"
          test -f "$shared_windows/ffmpeg.exe"
          test -f "$shared_windows/avcodec-63.dll"
          test -f "$shared_linux/libavcodec.so.63"
          test -f "$shared_linux/libavutil.so.61"

      - name: Commit generated feature binaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/desktop2stereo/streaming/vulkan_ffmpeg_bridge/windows
          git add -A src/desktop2stereo/streaming/vulkan_ffmpeg_bridge/linux
          git add -f src/desktop2stereo/streaming/rtmp/ffmpeg/bin
          git add -f src/desktop2stereo/streaming/rtmp/ffmpeg/lib/*.so*
          if git diff --cached --quiet; then
            echo "Vulkan bridges and shared runtime are unchanged"
            exit 0
          fi
          git commit -m "build: share Vulkan FFmpeg runtime dependencies"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
