[package]
name = "wc_cuda"
version = "0.1.3"
edition = "2024"
build = "build.rs"

[lib]
name = "_wc_cuda"
crate-type = ["cdylib"]

# Release profile tuned for the capture hot path. LTO + a single codegen unit
# let the compiler inline across crate boundaries (e.g. the per-frame copy and
# slot handoff), which trims per-frame CPU overhead. Build cost is higher, but
# runtime throughput is what matters here.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true


[dependencies]
pyo3 = { version = "0.23.4", features = ["extension-module", "abi3-py310"] }
thiserror = "2.0"
parking_lot = "0.12"
windows-capture = { path = "../windows_capture_exclusion" }

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
cc = "1.2"
