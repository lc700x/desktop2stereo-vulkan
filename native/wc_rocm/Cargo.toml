[package]
name = "wc_rocm"
version = "0.1.3"
edition = "2024"
build = "build.rs"

[lib]
name = "_wc_rocm"
crate-type = ["cdylib"]

[dependencies]
windows-capture = { version = "2.0.0", path = "../windows_capture_exclusion" }
pyo3 = { version = "0.23.4", features = ["extension-module", "abi3-py310"] }
thiserror = "2.0"
parking_lot = "0.12"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_WinRT",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
cc = "1.2"
